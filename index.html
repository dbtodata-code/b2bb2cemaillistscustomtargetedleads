```html
<!-- HEADER START -->
<header class="site-header">
  <div class="header-container">

    <!-- Logo / Brand -->
    <a href="#home" class="logo">
      Latest Database
    </a>

    <!-- Desktop Navigation -->
    <nav class="main-nav">
      <a href="#home">Home</a>
      <a href="#about">About Us</a>
      <a href="#services">Services</a>
      <a href="#pricing">Pricing</a>
      <a href="#images">Images</a>
      <a href="#contact">Contact</a>
    </nav>

    <!-- Header CTA with Backlink -->
    <a 
      href="https://www.latestdatabase.com" 
      class="header-cta"
      target="_blank"
      rel="noopener noreferrer"
    >
      B2B &amp; B2C Email Lists, Phone Number Lists &amp; Custom Targeted Leads
    </a>

    <!-- Mobile Menu Button -->
    <button class="menu-toggle" onclick="toggleMenu()" aria-label="Open Menu">
      ☰
    </button>

  </div>

  <!-- Mobile Navigation -->
  <div class="mobile-nav" id="mobileNav">
    <a href="#home" onclick="closeMenu()">Home</a>
    <a href="#about" onclick="closeMenu()">About Us</a>
    <a href="#services" onclick="closeMenu()">Services</a>
    <a href="#pricing" onclick="closeMenu()">Pricing</a>
    <a href="#images" onclick="closeMenu()">Images</a>
    <a href="#contact" onclick="closeMenu()">Contact</a>

    <a 
      href="https://www.latestdatabase.com"
      target="_blank"
      rel="noopener noreferrer"
      class="mobile-keyword"
    >
      B2B &amp; B2C Email Lists, Phone Number Lists &amp; Custom Targeted Leads
    </a>
  </div>
</header>

<style>
/* =========================
   HEADER DESIGN
========================= */

.site-header {
  position: sticky;
  top: 0;
  z-index: 9999;
  width: 100%;
  background: #ffffff;
  border-bottom: 1px solid #e8edf5;
  box-shadow: 0 3px 15px rgba(0, 0, 0, 0.06);
}

.header-container {
  max-width: 1250px;
  margin: auto;
  padding: 14px 25px;
  min-height: 72px;

  display: flex;
  align-items: center;
  gap: 25px;
}

/* Logo */

.logo {
  text-decoration: none;
  font-size: 25px;
  font-weight: 800;
  color: #1266f1;
  white-space: nowrap;
  margin-right: auto;
}

.logo:hover {
  color: #0d4fc0;
}

/* Desktop Navigation */

.main-nav {
  display: flex;
  align-items: center;
  gap: 22px;
}

.main-nav a {
  color: #26364a;
  text-decoration: none;
  font-size: 15px;
  font-weight: 600;
  transition: 0.25s ease;
}

.main-nav a:hover {
  color: #1266f1;
}

/* Header Keyword Backlink */

.header-cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  max-width: 300px;
  padding: 11px 16px;

  background: #1266f1;
  color: #ffffff;

  border-radius: 8px;
  text-decoration: none;

  font-size: 12px;
  font-weight: 700;
  line-height: 1.45;

  text-align: center;
  transition: all 0.25s ease;
}

.header-cta:hover {
  background: #0d4fc0;
  transform: translateY(-1px);
  color: #ffffff;
}

/* Mobile Button */

.menu-toggle {
  display: none;
  border: none;
  background: #1266f1;
  color: #ffffff;

  width: 42px;
  height: 42px;

  border-radius: 8px;
  cursor: pointer;

  font-size: 22px;
}

/* Mobile Navigation */

.mobile-nav {
  display: none;
  background: #ffffff;
  border-top: 1px solid #edf1f7;
  padding: 12px 20px 20px;
}

.mobile-nav a {
  display: block;
  padding: 12px 8px;

  color: #26364a;
  text-decoration: none;

  font-size: 15px;
  font-weight: 600;

  border-bottom: 1px solid #f0f2f6;
}

.mobile-nav a:hover {
  color: #1266f1;
}

.mobile-keyword {
  margin-top: 12px;
  padding: 13px 15px !important;

  background: #1266f1;
  color: #ffffff !important;

  border-radius: 8px;
  border: none !important;

  text-align: center;
  line-height: 1.5;
}

/* =========================
   TABLET
========================= */

@media (max-width: 1050px) {

  .header-container {
    gap: 15px;
    padding: 13px 18px;
  }

  .main-nav {
    gap: 13px;
  }

  .main-nav a {
    font-size: 14px;
  }

  .header-cta {
    max-width: 220px;
    font-size: 11px;
    padding: 9px 12px;
  }

  .logo {
    font-size: 22px;
  }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

  .header-container {
    min-height: 65px;
    padding: 11px 16px;
  }

  .main-nav,
  .header-cta {
    display: none;
  }

  .logo {
    font-size: 22px;
  }

  .menu-toggle {
    display: block;
    margin-left: auto;
  }

  .mobile-nav.active {
    display: block;
  }
}

/* Small Mobile */

@media (max-width: 420px) {

  .logo {
    font-size: 20px;
  }

  .menu-toggle {
    width: 40px;
    height: 40px;
  }

}
</style>

<script>
function toggleMenu() {
  document.getElementById("mobileNav").classList.toggle("active");
}

function closeMenu() {
  document.getElementById("mobileNav").classList.remove("active");
}
</script>
<!-- HEADER END -->
```
